<div class="auth-page">
  <div class="auth-card saas-card">
    <div class="auth-header">
      <div class="auth-logo">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h1>SecureFileShare</h1>
      <p class="auth-subtitle">Secure access to your files</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="username">Username or Email</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          class="saas-input"
          placeholder="operator@company.com"
        />
        <div class="field-error" *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid">
          Username is required
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="saas-input"
          placeholder="••••••••••••"
        />
        <div class="field-error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          Password is required
        </div>
      </div>

      <button type="submit" class="saas-btn saas-btn-primary auth-submit-btn" [disabled]="isAuthenticating">
        <i class="fa-solid fa-right-to-bracket" *ngIf="!isAuthenticating"></i>
        <i class="fa-solid fa-circle-notch fa-spin" *ngIf="isAuthenticating"></i>
        {{ isAuthenticating ? 'Authenticating...' : 'Sign In' }}
      </button>
    </form>

    <div class="auth-footer">
      <div class="system-status-indicator">
        <span class="status-dot dot-green"></span>
        <span>Authentication Service Online</span>
      </div>
      <div class="register-prompt">
        Don't have an operator account? <a routerLink="/register" class="text-sky">Create Account</a>
      </div>
    </div>
  </div>
</div>
