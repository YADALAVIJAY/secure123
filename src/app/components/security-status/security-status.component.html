<span class="cyber-badge" [ngClass]="{
  'badge-green': status === 'ONLINE' || status === 'VERIFIED' || status === 'ACTIVE',
  'badge-cyan': status === 'SCANNING',
  'badge-amber': status === 'OFFLINE',
  'badge-red': status === 'BLOCKED' || status === 'ERROR'
}">
  <span class="pulse-indicator" [ngClass]="{
    'online': status === 'ONLINE' || status === 'VERIFIED' || status === 'ACTIVE',
    'warning': status === 'OFFLINE' || status === 'SCANNING',
    'offline': status === 'BLOCKED' || status === 'ERROR'
  }"></span>
  <span>{{ label || status }}</span>
</span>
